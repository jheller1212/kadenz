name: Workout reminders

# Vercel Hobby allows exactly one cron job, and that slot is already used by
# the daily sync at /api/cron/gcal. Workout push reminders need to be checked
# far more often than once a day for their lead-time window to ever line up
# with a real send, so this schedule lives here instead: the repo is public,
# so GitHub Actions minutes are free and unlimited. This can move back to a
# second Vercel cron if the plan ever changes (delete this file, add the
# schedule to web/vercel.json).
#
# Honest caveat: GitHub's scheduled workflows are best-effort, not real-time —
# under platform load a run can drift 5 to 15 minutes late. The reminder
# dispatch endpoint is written to tolerate that (see web/src/lib/reminders/due.ts):
# it never fires for a workout whose start time has already passed, so a late
# or missed run skips that reminder instead of sending it stale.

# Measured with `gh run list`: this was drifting 1h50m to 2h46m between
# actual runs at */15, not the 15 minutes it says on the tin, which starved
# the reminder lead-time window of the cadence it needs. The primary
# schedule moved to a Cloudflare Worker cron trigger (see cron-worker/),
# which does run on time. This workflow is kept as a low-frequency backstop
# in case the Worker is not deployed yet or goes stale, so it was slowed to
# hourly instead of removed: it costs nothing and dispatch is idempotent.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Overlapping runs must not double-dispatch. The DB-level claim in
# dispatch.ts already makes a repeat call a no-op, but there's no reason to
# let GitHub pile up concurrent invocations when a previous one is still in
# flight, so cancel-in-progress is on here too (unlike ci.yml on main, a
# superseded reminder check has nothing worth keeping).
concurrency:
  group: workout-reminders
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch due reminders
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder cron endpoint
        run: |
          # Retried, so a single transient blip does not page anyone.
          #
          # Both endpoints are idempotent by construction — claim-before-send
          # and `FOR UPDATE SKIP LOCKED` — so a repeat call is a no-op, which
          # is what makes retrying safe rather than merely convenient. A run
          # only fails once the endpoint has failed every attempt, which is
          # the point: an email should mean "this is actually broken", not
          # "a cold start took too long once".
          #
          # --max-time is set above the server's own 120s cron budget and well
          # under the platform's 300s kill, so a hung request is abandoned by
          # the client rather than held to the bitter end.
          attempts=3
          for i in $(seq 1 $attempts); do
            # `|| true` is load-bearing: the step runs under `bash -e`, so a
            # curl that exits non-zero (28 = timed out) aborts the whole script
            # before the retry below ever runs. That is exactly what happened —
            # a run that "failed after 3 attempts" had in fact made one, then
            # died. Capturing the failure instead of inheriting it is what makes
            # this a retry rather than decoration.
            : > /tmp/response.txt   # so a stale body cannot be read as this attempt's
            status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              --max-time 120 \
              -X GET "https://kadenz-tau.vercel.app/api/cron/reminders" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true)
            echo "Attempt $i/$attempts — HTTP status: ${status:-timeout}"
            cat /tmp/response.txt
            echo
            if [ "${status:-0}" -ge 200 ] && [ "${status:-0}" -lt 300 ]; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Retrying in 20s…"
              sleep 20
            fi
          done
          echo "Reminder dispatch failed $attempts attempts in a row (last status $status)"
          exit 1
