name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are wasted minutes: pushing twice to a PR previously ran CI
# to completion twice. Never cancel on main - those runs are the post-merge
# record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Match the runtime the app is actually deployed on. On Node 20 the
          # bundled npm read this lockfile differently and npm ci failed with a
          # phantom "Missing: esbuild@0.28.1 from lock file", while npm ci on
          # the deploy runtime resolves it cleanly.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reuse the previous build's compiler cache. next build dominates this
      # job's runtime, and a warm .next/cache cuts most of the recompilation.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**') }}
          restore-keys: |
            next-${{ hashFiles('web/package-lock.json') }}-
            next-

      # Blocking: the lint-error debt (React 19 / eslint-config-next 16 hook
      # rules) is cleared. `eslint` exits non-zero on errors only — remaining
      # warnings are surfaced in logs but do not gate CI.
      - name: Lint
        run: npm run lint

      # Blocking: `next build` does NOT fail on type errors in this setup, so
      # tsc is the only real type gate.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # `next build` reads no real secrets — the DB client (postgres-js) is
      # constructed lazily and never connects at build time, so no DATABASE_URL
      # or OAuth credentials are required. Verified: build passes with env unset.
      - name: Build
        # next build (webpack) peaks above CI's default ~2 GB Node heap and OOMs;
        # the runner has ~7 GB, so give the build room.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  worker:
    name: Garmin Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garmin-worker
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest
