name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: the repo currently has pre-existing lint errors (new
      # React 19 / eslint-config-next 16 hook rules). Surfaced in logs but not
      # gating CI so it can be adopted without failing on day one. Flip to a
      # required step once the existing lint debt is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Blocking: `next build` does NOT fail on type errors in this setup, so
      # tsc is the only real type gate.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # `next build` reads no real secrets — the DB client (postgres-js) is
      # constructed lazily and never connects at build time, so no DATABASE_URL
      # or OAuth credentials are required. Verified: build passes with env unset.
      - name: Build
        run: npm run build

  worker:
    name: Garmin Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garmin-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest
