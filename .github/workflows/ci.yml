name: CI

on:
  push:
    branches: [main]
  # Deliberately no `branches:` filter here. With `branches: [main]`, a pull
  # request whose base is any other branch fired no event at all, so no required
  # check ran — and GitHub then reported the PR as mergeable, because there is
  # nothing to be un-mergeable about when no check exists. Every stacked PR in
  # this repo was silently unverified while looking clean, which is worse than
  # being red.
  #
  # An explicit allowlist of long-lived integration branches would work too, but
  # it fails the same way the first time someone stacks onto a branch nobody
  # remembered to add. No filter cannot miss one.
  pull_request:

# Superseded runs are wasted minutes: pushing twice to a PR previously ran CI
# to completion twice. Never cancel on main - those runs are the post-merge
# record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Match the runtime the app is actually deployed on. On Node 20 the
          # bundled npm read this lockfile differently and npm ci failed with a
          # phantom "Missing: esbuild@0.28.1 from lock file", while npm ci on
          # the deploy runtime resolves it cleanly.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reuse the previous build's compiler cache. next build dominates this
      # job's runtime, and a warm .next/cache cuts most of the recompilation.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**') }}
          restore-keys: |
            next-${{ hashFiles('web/package-lock.json') }}-
            next-

      # Blocking: the lint-error debt (React 19 / eslint-config-next 16 hook
      # rules) is cleared. `eslint` exits non-zero on errors only — remaining
      # warnings are surfaced in logs but do not gate CI.
      - name: Lint
        run: npm run lint

      # Blocking: `next build` does NOT fail on type errors in this setup, so
      # tsc is the only real type gate.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # `next build` reads no real secrets — the DB client (postgres-js) is
      # constructed lazily and never connects at build time, so no DATABASE_URL
      # or OAuth credentials are required. Verified: build passes with env unset.
      - name: Build
        # next build (webpack) peaks above CI's default ~2 GB Node heap and OOMs;
        # the runner has ~7 GB, so give the build room.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    # The whole suite is ~2 minutes of tests on top of ~3 minutes of setup. A
    # cap well above that turns a hung dev server into a failure instead of a
    # job that sits there burning minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No Postgres service container on purpose: the harness starts its own
      # local Postgres (the embedded-postgres package, installed by npm ci as a
      # platform-specific dependency) on 127.0.0.1:54329 and refuses to run
      # against any DATABASE_URL but that one. A service container would be a
      # second database the suite would never talk to. Same reason there is no
      # separate seed step here: global-setup.ts pushes the schema and runs
      # e2e/seed.ts itself, so CI and a laptop go through the identical path.
      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are ~150 MB and change only when Playwright does.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium only — playwright.config.ts runs a single mobile-viewport
      # Chromium project, so downloading Firefox and WebKit would be minutes
      # spent on browsers no spec ever opens.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          # See the note on the install-deps step below — same apt exposure,
          # same treatment.
          for i in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $i/3 failed or timed out; retrying in 15s…"
            sleep 15
          done
          echo "playwright install --with-deps failed 3 attempts in a row"
          exit 1

      # The cache above restores the browser but not the apt libraries it links
      # against, so those still need installing on a cache hit.
      # ── Bounded and retried, because this step reaches the network ──────────
      #
      # `playwright install-deps` shells out to apt, so it depends on a mirror
      # answering — the one thing in this job that can fail for reasons having
      # nothing to do with the code under test. When it hung, it hung for the
      # full 20-minute job timeout and the run was reported as a FAILED e2e
      # job with the tests marked "skipped": they never ran. Twice in a row,
      # on the same PR, which is how a mirror outage came to block a fix for a
      # production incident.
      #
      # `timeout 300` per attempt is the important half. Without it a hang
      # consumes the whole job budget before anyone learns anything; with it a
      # bad mirror costs five minutes and gets retried, and three genuinely bad
      # attempts still fail the job — this makes the step survivable, not
      # unskippable.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 18
        run: |
          for i in 1 2 3; do
            if timeout 300 npx playwright install-deps chromium; then
              exit 0
            fi
            echo "Attempt $i/3 failed or timed out; retrying in 15s…"
            sleep 15
          done
          echo "playwright install-deps failed 3 attempts in a row"
          exit 1

      # Blocking, like every other gate here. DATABASE_URL is deliberately not
      # set: global-setup.ts refuses to start if it points anywhere other than
      # its own local database.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # test-results carries the trace zips for the failed tests
          # (trace: retain-on-failure), which is what makes a CI-only failure
          # debuggable: npx playwright show-trace on the downloaded file.
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  worker:
    name: Garmin Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garmin-worker
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest
