name: Sync outbox drain

# Safety net for delivering plan changes to Google Calendar and the watch.
# A plan create/edit/delete already triggers its own drain immediately (see
# web/src/lib/sync/outbox-drain.ts), so this is not the primary delivery
# path — it exists in case that drain gets cut off mid-flight (hard
# serverless timeout, a bad deploy) and nothing else would pick the leftover
# rows up until the once-daily /api/cron/gcal run.
#
# Same reasoning as reminders.yml: Vercel Hobby allows exactly one cron job
# and that slot is spent on /api/cron/gcal, but the repo is public so GitHub
# Actions minutes are free. See web/src/app/api/cron/sync-drain/route.ts for
# why this is safe to run this often and concurrently with everything else.

# Measured with `gh run list`: this was drifting up to 2h31m between actual
# runs at */15, the same GitHub Actions scheduling gap that hit
# reminders.yml. The primary schedule moved to a Cloudflare Worker cron
# trigger (see cron-worker/), which does run on time. This workflow is kept
# as a low-frequency backstop in case the Worker is not deployed yet or goes
# stale, so it was slowed to hourly instead of removed: it costs nothing and
# a repeat drain is a no-op once the outbox is empty.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-outbox-drain
  cancel-in-progress: true

jobs:
  drain:
    name: Drain sync outbox
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-drain cron endpoint
        run: |
          # Retried, so a single transient blip does not page anyone.
          #
          # Both endpoints are idempotent by construction — claim-before-send
          # and `FOR UPDATE SKIP LOCKED` — so a repeat call is a no-op, which
          # is what makes retrying safe rather than merely convenient. A run
          # only fails once the endpoint has failed every attempt, which is
          # the point: an email should mean "this is actually broken", not
          # "a cold start took too long once".
          #
          # --max-time is set above the server's own 120s cron budget and well
          # under the platform's 300s kill, so a hung request is abandoned by
          # the client rather than held to the bitter end.
          attempts=3
          for i in $(seq 1 $attempts); do
            status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              --max-time 180 \
              -X GET "https://kadenz-tau.vercel.app/api/cron/sync-drain" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            echo "Attempt $i/$attempts — HTTP status: $status"
            cat /tmp/response.txt
            echo
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Retrying in 20s…"
              sleep 20
            fi
          done
          echo "Sync drain failed $attempts attempts in a row (last status $status)"
          exit 1
